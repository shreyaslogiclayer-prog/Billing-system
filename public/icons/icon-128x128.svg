      <line x1="19.2" y1="26.88" x2="57.599999999999994" y2="26.88"/>
      <line x1="19.2" y1="42.24" x2="57.599999999999994" y2="42.24"/>
      <line x1="19.2" y1="57.599999999999994" x2="57.599999999999994" y2="57.599999999999994"/>
